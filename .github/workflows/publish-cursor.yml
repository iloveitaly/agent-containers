name: Publish ubuntu-docker-mise-direnv

on:
  push:
    branches: [master]
    paths:
      - "cursor/**"
      - ".github/workflows/publish-cursor.yml"
  pull_request:
    branches: [master]
    paths:
      - "cursor/**"
      - ".github/workflows/publish-cursor.yml"
  workflow_dispatch:

env:
  # Matches local Justfile tag: ubuntu-docker-mise-direnv:local
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ubuntu-docker-mise-direnv

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # write-all ensures the package inherits repo permissions/visibility linkage.
    # See: https://stackoverflow.com/questions/77092191/use-github-to-change-visibility-of-ghcr-io-package
    # (same pattern as github-actions-metadata-sync)
    permissions: write-all

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
          # source label links the package to this repo (discovery + permission inheritance)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ github.event.repository.description }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: cursor
          file: cursor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
